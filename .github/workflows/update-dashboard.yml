name: Update Dashboard Data

on:
  # Run on the 16th of each month at 14:00 UTC (CPI typically releases 8:30 AM ET on ~10th-15th)
  schedule:
    - cron: '0 14 16 * *'
  # Allow manual trigger — use this for next week's CPI release
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BLS data
        run: python3 dashboard/fetch_bls_data.py --out dashboard/data.json

      - name: Commit updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dashboard/data.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Update dashboard data $(date -u +%Y-%m-%d) [skip ci]"
          git push
